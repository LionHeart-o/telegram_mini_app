            --tg-theme-secondary-bg-color: #efeff4;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            color: var(--tg-theme-text-color);

        label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 14px; }

        /* 输入框样式 */
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; box-sizing: border-box; font-size: 16px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }

        /* 只读输入框样式 */
        input[readonly] {
            background-color: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-hint-color);
            border-color: #ddd;
            cursor: not-allowed;
        }

        /* 评分滑动条样式 */
        .score-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        input[type="range"] { flex: 1; }
        .score-val { font-weight: bold; color: var(--tg-theme-button-color); width: 25px; }

        .btn-group { margin-top: 20px; }
        button {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            background-color: var(--tg-theme-button-color); color: white;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        
        /* Dialog styles */
        dialog {
            border: none;
            border-radius: 12px;
            padding: 0;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            width: 300px;
        }
        
        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }

    // 解析模板报告
    function parseTemplate(text) {
        try {
            const data = {};
            
            // 提取案件发生地
            const locMatch = text.match(/#案件发生地 #(.+)/);
            if (locMatch) data.loc = locMatch[1].trim();
            
            // 提取嫌疑人姓名
            const nameMatch = text.match(/#嫌疑人姓名 #(.+)/);
            if (nameMatch) data.name = nameMatch[1].trim();
            
            // 提取日期
            const dateMatch = text.match(/#日期 (.+)/);
            if (dateMatch) data.date = dateMatch[1].trim();
            
            // 提取消费金额（不做处理，保持原样）
            const costMatch = text.match(/#消费 (.+)/);
            if (costMatch) {
                data.cost = costMatch[1].trim();
            }
            
            // 提取人照符合度
            const matchMatch = text.match(/#人照符合度 (.+)/);
            if (matchMatch) {
                // 只保留数字和小数点
                const value = matchMatch[1].trim().replace(/[^\d.]/g, '');
                if (value) data.match = value;
            }
            
            // 提取颜值
            const faceMatch = text.match(/#颜值 (.+)/);
            if (faceMatch) {
                // 只保留数字和小数点
                const value = faceMatch[1].trim().replace(/[^\d.]/g, '');
                if (value) data.face = value;
            }
            
            // 提取身材
            const bodyMatch = text.match(/#身材 (.+)/);
            if (bodyMatch) {
                // 移除数字和特殊字符，只保留文字
                data.body = bodyMatch[1].trim().replace(/[\d\s]+/g, ' ').trim();
            }
            
            // 提取性格
            const charMatch = text.match(/#性格 (.+)/);
            if (charMatch) {
                // 移除数字和特殊字符，只保留文字
                data.char = charMatch[1].trim().replace(/[\d\s]+/g, ' ').trim();
            }
            
            // 提取上路
            const topMatch = text.match(/#上路 (.+)/);
            if (topMatch) {
                // 只保留数字和小数点
                const value = topMatch[1].trim().replace(/[^\d.]/g, '');
                if (value) data.top = value;
            }
            
            // 提取中路
            const midMatch = text.match(/#中路 (.+)/);
            if (midMatch) {
                // 只保留数字和小数点
                const value = midMatch[1].trim().replace(/[^\d.]/g, '');
                if (value) data.mid = value;
            }
            
            // 提取综合评价
            const totalMatch = text.match(/#综合评价 (.+)/);
            if (totalMatch) {
                // 只保留数字和小数点
                const value = totalMatch[1].trim().replace(/[^\d.]/g, '');
                if (value) data.total = value;
            }
            
            // 提取详细体验
            const descMatch = text.match(/#详细体验[\s\S]+?(?=\s*(#?(名侦探|侦探名)(?:🕵️)?))/);
            if (descMatch) {
                data.desc = descMatch[0].replace('#详细体验', '').trim();
            }
            
            // 提取名侦探
            const detectiveMatch = text.match(/(?:#)?(名侦探|侦探名)(?:🕵️)?\s*(.+)/);
            if (detectiveMatch) data.detective = detectiveMatch[2].trim();
            
            // 提取店家联系方式
            const contactMatch = text.match(/#店家联系方式: (.+)/);
            if (contactMatch) data.contact = contactMatch[1].trim();
            
            return data;
        } catch (error) {
            console.error('解析模板失败:', error);
            return null;
        }
    }

        // 检查身材和性格描述

        if (charRegex.test(data.char)) {
            showAlert('性格描述不能只是数字，请提供详细描述');
            return;
        }
        
        // 检查综合评分9分及以上时的描述长度
        const totalScore = parseFloat(data.total);
        if (totalScore >= 9 && data.desc.length <= 200) {
            showAlert('高分报告，字符数必须大于200。实在憋不出了把分改到9.0以下');
            return;
        }
        
        // 格式化数字，保留一位小数
        const formatNumber = (value) => {
            const num = parseFloat(value);
            if (!isNaN(num)) {
                return num.toFixed(1);
            }
            return value;
        };
        
        // 应用格式化
        const formattedMatch = formatNumber(data.match);
        const formattedFace = formatNumber(data.face);
        const formattedTop = formatNumber(data.top);
        const formattedMid = formatNumber(data.mid);
        const formattedTotal = formatNumber(data.total);

        const report = `#案件发生地 #${data.loc}
#嫌疑人姓名 #${data.name}
#日期 ${data.date}
#消费 ${data.cost}

#颜值 ${formattedFace}

#中路 ${formattedMid}
#综合评价 ${formattedTotal}

${data.desc}

报告审核: @lioyd_bannings_bot
侦探事务所: https://t.me/szmmk_7
侦探事务所卷宗: https://t.me/sz_mmk_jz`;

        // 更新报告展示区域
        document.getElementById('report-display').value = report;
        
        // 尝试多种复制方法
        let copySuccess = false;
        
        // 方法1: 使用 navigator.clipboard（现代浏览器）
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
                await navigator.clipboard.writeText(report);
                copySuccess = true;
                showAlert('报告已生成并复制到剪贴板');
                // 隐藏报告展示区域
                document.getElementById('report-display-section').style.display = 'none';
            } catch (err) {
                console.error('方法1失败:', err);
            }
        }
        
        // 方法2: 使用 document.execCommand（兼容性较好）
        if (!copySuccess) {
            try {
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = report;
                tempTextArea.style.position = 'fixed';
                tempTextArea.style.opacity = '0';
                tempTextArea.style.left = '0';
                tempTextArea.style.top = '0';
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                tempTextArea.setSelectionRange(0, 999999);
                copySuccess = document.execCommand('copy');
                document.body.removeChild(tempTextArea);
                
                if (copySuccess) {
                    showAlert('报告已生成并复制到剪贴板');
                    document.getElementById('report-display-section').style.display = 'none';
                }
            } catch (err) {
                console.error('方法2失败:', err);
            }
        }
        
        // 方法3: 使用 selection API
        if (!copySuccess) {
            try {
                const tempDiv = document.createElement('div');
                tempDiv.textContent = report;
                tempDiv.style.position = 'fixed';
                tempDiv.style.opacity = '0';
                tempDiv.style.left = '0';
                tempDiv.style.top = '0';
                document.body.appendChild(tempDiv);
                
                const range = document.createRange();
                range.selectNodeContents(tempDiv);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                
                copySuccess = document.execCommand('copy');
                document.body.removeChild(tempDiv);
                selection.removeAllRanges();
                
                if (copySuccess) {
                    showAlert('报告已生成并复制到剪贴板');
                    document.getElementById('report-display-section').style.display = 'none';
                }
            } catch (err) {
                console.error('方法3失败:', err);
            }
        }
        
        // 如果所有方法都失败，显示报告展示区域
        if (!copySuccess) {
            showAlert('复制失败，请手动复制下方报告');
            document.getElementById('report-display-section').style.display = 'block';
        }
    }
    
    // 手动复制报告

            console.error('手动复制失败:', err);
            showAlert('复制失败，请按 Ctrl+C 或 Cmd+C 复制');
        }
    }
